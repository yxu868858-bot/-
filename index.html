<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>义巷·漫游集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f2; --cream:#f5eee2; --ink:#1d1a17; --ink2:#5d554c; --ink3:#958b80;
  --rose:#d43a7f; --rose2:#f28bb6; --brick:#a64a33; --gold:#e3a33b; --leaf:#5d8a48; --night:#0d0b0a;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#080706;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));overflow:hidden;background:var(--paper);cursor:pointer;user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;background:var(--paper);transition:opacity .7s ease,visibility 0s .7s}
.slide.on{opacity:1;visibility:visible;transition:opacity .8s ease;z-index:2}
.dark{background:var(--night);color:#f3ede4}
.cream{background:var(--cream)}
.white{background:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
img{display:block}
p{margin:0}

/* ---------- 入场动画 ---------- */
.fx{opacity:0;transition:opacity .35s,transform .35s,clip-path .35s,filter .35s}
.fx.up{transform:translateY(50px)} .fx.down{transform:translateY(-50px)}
.fx.left{transform:translateX(-80px)} .fx.right{transform:translateX(80px)}
.fx.zoom{transform:scale(.9)} .fx.blur{filter:blur(16px)}
.fx.wipe{opacity:1;clip-path:inset(0 100% 0 0)} .fx.rise{opacity:1;clip-path:inset(100% 0 0 0)}
.fx.iris{opacity:1;clip-path:circle(0% at 50% 50%)}
.on .fx{opacity:1;transform:none;filter:none;
  transition:opacity 1s var(--ease) var(--d,0s),transform 1.2s var(--ease) var(--d,0s),clip-path 1.4s cubic-bezier(.75,0,.2,1) var(--d,0s),filter 1.1s ease var(--d,0s)}
.on .fx.wipe,.on .fx.rise{clip-path:inset(0 0 0 0)}
.on .fx.iris{clip-path:circle(75% at 50% 50%)}
.chars span{display:inline-block;opacity:0;transform:translateY(.45em) rotate(6deg);filter:blur(8px);transition:all .3s}
.on .chars span{opacity:1;transform:none;filter:none;transition:opacity .9s var(--ease) var(--d),transform 1.1s var(--ease) var(--d),filter 1s ease var(--d)}
.on .kb{animation:kb var(--kbd,16s) ease-out both}
@keyframes kb{from{transform:scale(var(--kbs,1.12)) translate(var(--kx,1%),var(--ky,.6%))}to{transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s}
.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset var(--t,1.8s) cubic-bezier(.6,0,.2,1) var(--d,0s)}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s}
.on .pop{transform:scale(1);transition:transform .8s cubic-bezier(.3,1.6,.5,1) var(--d,0s)}
.bar i{display:block;height:100%;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.on .bar i{transform:scaleX(1);transition:transform 1.4s var(--ease) var(--d,0s)}

/* 分析图生长动画 */
.ly{display:block;width:100%;height:100%;overflow:visible}
.lyr{opacity:0;transform-box:fill-box;transform-origin:center}
.on .lyr.grow{animation:lyGrow 1.4s cubic-bezier(.2,.8,.2,1) var(--d) both}
.on .lyr.wipe{animation:lyWipe 1.4s cubic-bezier(.7,0,.2,1) var(--d) both}
.on .lyr.pop{animation:lyPop .8s cubic-bezier(.3,1.5,.5,1) var(--d) both}
@keyframes lyGrow{from{opacity:0;clip-path:circle(0% at 50% 50%);transform:scale(.92)}30%{opacity:1}to{opacity:1;clip-path:circle(71% at 50% 50%);transform:none}}
@keyframes lyWipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes lyPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}

/* ---------- 通用版式 ---------- */
.hd{position:absolute;left:96px;top:56px;z-index:6}
.hd b{display:block;font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:.08em;line-height:1.2}
.hd span{display:block;font-family:var(--latin);font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.hd::before{content:"";position:absolute;left:-26px;top:8px;width:6px;height:38px;background:var(--rose);border-radius:3px}
.dark .hd span,.onimg .hd span{color:#b9ad9c}
.onimg .hd b{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.pn{position:absolute;right:56px;bottom:40px;z-index:6;font-family:var(--latin);font-size:20px;letter-spacing:.2em;color:var(--ink3)}
.dark .pn,.onimg .pn{color:rgba(255,255,255,.7)}
.latin{font-family:var(--latin);letter-spacing:.3em;text-transform:uppercase}
.rose{color:var(--rose)}
.box{position:absolute}
.box img{width:100%;height:100%;object-fit:contain}
.lead{font-size:26px;line-height:1.8;color:var(--ink2)}
.lead-en{font-family:var(--latin);font-size:20px;line-height:1.5;color:var(--ink3);margin-top:10px}
.dark .lead{color:#d9cdbb}
.cl{position:absolute;overflow:hidden}
.cl img{width:100%;height:100%;object-fit:cover}
.cl .lab{position:absolute;left:14px;bottom:12px;color:#fff;font-size:22px;letter-spacing:.1em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:30px;font-size:22px;background:#fff;border:1px solid #e6dccd;color:var(--ink2)}
.chip i{display:inline-block;width:16px;height:16px;border-radius:4px}

/* 封面 */
.cover-txt{position:absolute;left:150px;top:220px;width:1500px}
.cover-txt .eyebrow{font-size:30px;letter-spacing:.5em;color:#e9ddc9}
.cover h1{white-space:nowrap;font-family:var(--serif);font-weight:700;font-size:180px;line-height:1.15;margin:30px 0 10px;letter-spacing:.06em;color:#fff;text-shadow:0 10px 50px rgba(0,0,0,.4)}
.cover .lt{font-size:34px;color:var(--rose2)}
.cover .rule{width:520px;height:2px;margin:50px 0 36px;background:linear-gradient(90deg,var(--rose),transparent)}
.cover .slogan{font-family:var(--serif);font-size:46px;letter-spacing:.4em;color:#f5ead8}
.cover .meta{position:absolute;left:150px;bottom:100px;font-size:26px;letter-spacing:.3em;color:#cbbda9;line-height:1.8}

/* 目录 */
.toc-l{position:absolute;left:150px;top:180px}
.toc-l .big{font-family:var(--serif);font-size:120px;font-weight:300;letter-spacing:.2em}
.toc-l .latin{font-size:46px;color:var(--rose2);margin-top:10px}
.toc-list{position:absolute;left:820px;right:150px;top:170px;list-style:none;margin:0;padding:0}
.toc-list li{display:flex;align-items:center;gap:40px;height:118px;border-bottom:1px solid rgba(255,255,255,.14);cursor:pointer}
.toc-list li:hover .q{color:var(--rose2)}
.toc-list .n{font-family:var(--latin);font-size:30px;letter-spacing:.3em;color:#9c907f;width:180px}
.toc-list .n em{font-style:normal;font-size:64px;color:var(--rose2);letter-spacing:0;margin-left:6px}
.toc-list .q{font-family:var(--serif);font-size:42px;letter-spacing:.12em;transition:color .3s}

/* 篇章扉页 */
.divi .pic{position:absolute;left:0;top:0;width:1060px;height:1080px;overflow:hidden}
.divi .arch{position:absolute;left:880px;top:-2px;right:0;bottom:0;background:var(--cream);border-top-left-radius:620px 760px}
.divi .part{position:absolute;left:1040px;top:300px;font-family:var(--latin);font-weight:300;font-size:120px;letter-spacing:.12em;color:#b9ad9e;line-height:1}
.divi .part em{font-style:normal;font-size:250px;color:var(--rose);margin-left:24px;vertical-align:-14px;font-weight:300}
.divi .ln{position:absolute;left:1054px;top:640px;width:700px;height:2px;background:var(--rose)}
.divi .q{position:absolute;left:1050px;top:670px;font-family:var(--serif);font-size:62px;letter-spacing:.1em}
.divi .en{position:absolute;left:1054px;top:780px;font-size:24px;color:var(--ink3)}

/* 片区扉页 */
.sub .t{position:absolute;left:150px;top:450px;display:flex;align-items:baseline;gap:40px}
.sub .t b{font-family:var(--serif);font-weight:500;font-size:110px;letter-spacing:.2em}
.sub .t span{font-family:var(--latin);font-size:56px;letter-spacing:.24em;color:#cdbfae;text-transform:uppercase;font-weight:300}
.sub svg{position:absolute;left:0;top:0}

/* 效果图满屏页 */
.rd{background:#000}
.rd .full{position:absolute;inset:0;overflow:hidden}
.rd .full img{width:100%;height:100%;object-fit:cover}
.rd .cap{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(0deg,rgba(0,0,0,.62),transparent);z-index:3}
.rd .ct{position:absolute;left:96px;bottom:54px;z-index:4;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.rd .ct .k{font-size:20px;letter-spacing:.3em;opacity:.85}
.rd .ct .n{font-family:var(--serif);font-size:54px;letter-spacing:.24em;margin-top:8px}
.rd .ct .n small{font-family:var(--latin);font-style:italic;font-size:30px;letter-spacing:.06em;margin-left:22px;color:var(--rose2)}
.rd .idx{position:absolute;right:56px;bottom:84px;z-index:4;color:#fff;font-size:20px;letter-spacing:.3em;text-align:right}
.rd .idx b{font-family:var(--latin);font-size:44px;font-weight:500;letter-spacing:.06em;color:#fff;margin-left:12px}
.rd .tag{position:absolute;left:96px;top:56px;z-index:4;padding:8px 22px;border-radius:24px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;letter-spacing:.2em;backdrop-filter:blur(6px)}
.rd .quote{position:absolute;right:120px;top:90px;z-index:4;color:#fff;text-align:right;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.rd .quote b{display:block;font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:.2em;margin-bottom:16px}
.rd .quote span{font-family:var(--serif);font-size:30px;letter-spacing:.16em;line-height:1.9;color:#ffe5ef}

/* 分区平面 */
.pl-box{position:absolute;left:96px;top:150px;width:1080px;height:880px;display:flex;align-items:center;justify-content:center}
.pl-box img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 60px -34px rgba(60,30,10,.45)}
.pl-r{position:absolute;left:1260px;right:96px;top:150px}
.pl-r h2{font-family:var(--serif);font-weight:500;font-size:76px;letter-spacing:.42em;margin:0;color:var(--rose);white-space:nowrap}
.pl-r .en{font-family:var(--latin);font-size:30px;letter-spacing:.12em;color:var(--rose2);margin:6px 0 40px;text-transform:uppercase;line-height:1.3}
.pl-r .key{width:100%;height:150px;margin-bottom:46px}
.pl-r .key img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:6px}
.pl-r ul{list-style:none;margin:0;padding:0}
.pl-r li{font-size:28px;padding:14px 0;border-bottom:1px solid #e9dfd1;color:var(--ink)}
.pl-r li b{font-family:var(--latin);font-weight:500;font-size:32px;color:var(--rose);margin-right:22px}
.pl-r .fn{display:inline-block;margin-bottom:24px;padding:6px 18px;border-radius:20px;background:var(--rose);color:#fff;font-size:20px;letter-spacing:.2em}

/* 案例 */
.case-band{position:absolute;left:0;background:rgba(0,0,0,.78);color:#fff;padding:26px 60px 26px 70px;z-index:3}
.case-band .nm{font-family:var(--serif);font-size:46px;letter-spacing:.12em}
.case-band .nm span{font-family:var(--latin);font-size:46px;letter-spacing:.02em;margin-left:20px}
.case-band .pt{font-family:var(--serif);font-size:44px;color:var(--gold);margin-top:8px}
.case-band .tg{font-size:24px;color:var(--gold);margin-top:6px}
.case-band .mt{display:grid;grid-template-columns:auto auto;gap:4px 60px;font-size:19px;color:#d8d0c4;margin-top:16px;width:max-content}

/* 案例总结 */
.sum-l{position:absolute;left:110px;top:330px;width:520px}
.sum-l .t{font-family:var(--serif);font-size:60px;line-height:1.35;letter-spacing:.12em}
.sum-l .latin{font-size:18px;color:#9b8f80;margin-top:30px;line-height:1.8;letter-spacing:.2em}
.sum-list{position:absolute;left:640px;width:800px;top:200px}
.sum-list .it{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:30px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.sum-list .n{font-family:var(--latin);font-size:72px;color:var(--gold);line-height:1}
.sum-list .c{font-family:var(--serif);font-size:42px;letter-spacing:.14em;color:var(--gold)}
.sum-list .e{font-family:var(--latin);font-size:21px;color:#a99d8c;margin-top:6px;font-style:italic}

/* 设计定位 */
.pos-c{position:absolute;left:0;right:0;top:250px;text-align:center}
.pos-c .out{font-family:var(--latin);font-size:132px;letter-spacing:.14em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55);line-height:1}
.pos-c h2{font-family:var(--serif);font-size:118px;font-weight:700;margin:40px 0 0;letter-spacing:.18em;color:var(--rose2)}
.pos-c .sub{font-size:40px;margin-top:60px;letter-spacing:.2em;color:#fff}
.pos-c .sub2{font-family:var(--latin);font-size:22px;letter-spacing:.2em;color:#c8bba8;margin-top:24px;line-height:1.6}
.pt-title{position:absolute;left:0;right:0;top:120px;text-align:center}
.pt-title h2{font-family:var(--serif);font-size:58px;font-weight:500;letter-spacing:.12em;margin:0}
.pt-title p{font-family:var(--latin);font-size:20px;letter-spacing:.1em;color:#a99d8c;margin-top:12px;text-transform:uppercase;padding:0 200px;line-height:1.5}
.pt-rule{position:absolute;left:0;right:0;top:268px;height:1px;background:rgba(255,255,255,.25)}
.stmts{position:absolute;left:96px;right:96px;bottom:60px;display:flex;gap:40px;justify-content:center}
.stmt{padding:18px 30px;border-radius:10px;background:rgba(255,255,255,.08);border-left:5px solid var(--c,var(--rose))}
.stmt b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;color:var(--c,var(--rose2))}
.stmt span{font-size:22px;color:#e1d6c6}

/* 设计策略 */
.sg{position:absolute;top:150px;bottom:40px;width:880px}
.sg .tg{display:inline-block;padding:10px 26px 8px;color:#fff;font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:.06em;background:var(--c)}
.sg .tg small{display:block;font-family:var(--latin);font-weight:300;font-size:18px;letter-spacing:.5em}
.sg p{font-size:22px;line-height:1.7;margin:22px 0 18px;color:#e6dccd}
.white .sg p{color:var(--ink2)}
.sg .im{position:absolute;left:0;right:0;top:250px;bottom:0}
.sg .im img{width:100%;height:100%;object-fit:contain}

/* FAST / SLOW */
.fs .streaks{position:absolute;inset:0;overflow:hidden;opacity:0}
.on.fs .streaks{animation:fastPhase 5.2s ease forwards}
@keyframes fastPhase{0%{opacity:0}8%{opacity:1}68%{opacity:1}100%{opacity:0}}
.streaks i{position:absolute;height:2px;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,120,180,.9),#fff);animation:zip var(--sp) linear infinite;animation-delay:var(--dl)}
@keyframes zip{to{transform:translateX(480%)}}
.fs .fastt{position:absolute;left:130px;top:250px;opacity:0}
.on.fs .fastt{animation:fastPhase 5.2s ease forwards}
.fs .fastt .w{font-family:var(--latin);font-size:300px;line-height:.9;font-style:italic;color:#fff}
.fs .fastt p{font-size:40px;color:#f2e6d6;margin-top:30px;letter-spacing:.12em}
.motes i{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:rgba(255,226,190,.75);box-shadow:0 0 18px rgba(255,200,150,.8);animation:drift var(--sp) ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--mx),var(--my))}}
.fs .slowt{position:absolute;right:130px;bottom:120px;text-align:right}
.fs .slowt .w{font-family:var(--latin);font-size:220px;line-height:.9;font-weight:300;color:#f6ead8;letter-spacing:.3em}
.fs .slowt p{font-size:34px;color:#f2e6d6;margin-top:20px;letter-spacing:.12em}
.fs .theme{position:absolute;left:0;right:0;top:330px;text-align:center}
.fs .theme h2{font-family:var(--serif);font-size:110px;margin:0;color:#fff;letter-spacing:.16em;font-weight:700}
.fs .theme .latin{font-size:26px;color:var(--rose2);margin-top:18px}
.fs .theme .s{font-family:var(--serif);font-size:44px;letter-spacing:.6em;color:#f2e6d6;margin-top:26px}

/* 总图标注 */
.mp{position:absolute;left:0;right:0;top:170px;height:568px;overflow:hidden}
.mp img{width:100%;height:100%;object-fit:cover}
.hot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid var(--rose);opacity:0;transform:scale(2);transition:all .6s var(--ease)}
.hot.show{opacity:1;transform:scale(1)}
.hot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--rose);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(3.2);opacity:0}}
.legend{position:absolute;left:96px;right:96px;top:770px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px 20px;list-style:none;margin:0;padding:0}
.legend li{font-size:23px;padding:10px 14px;border-radius:8px;color:var(--ink2);transition:all .4s}
.legend li b{font-family:var(--latin);font-size:27px;color:var(--rose);margin-right:10px;font-weight:500}
.legend li.cur{background:var(--rose);color:#fff}
.legend li.cur b{color:#fff}

/* 断面 */
.reasons{list-style:none;padding:0;margin:0;counter-reset:r}
.reasons li{counter-increment:r;position:relative;padding:18px 0 18px 70px;font-size:26px;line-height:1.6;color:var(--ink);border-bottom:1px solid #e9dfd1}
.reasons li::before{content:counter(r);position:absolute;left:6px;top:10px;font-family:var(--latin);font-size:44px;color:var(--rose)}
.strip{display:flex;height:96px;border-radius:10px;overflow:hidden}
.strip .bar i{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-size:24px;color:#fff;font-family:var(--serif);line-height:1.2}
.strip .bar i small{font-family:var(--latin);font-size:22px;opacity:.9}

/* 功能结构 */
.flow{stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

/* 片区总览 */
.ov4{position:absolute;left:0;right:0;bottom:0;height:500px;display:flex}
.ov4 .t{flex:1;position:relative;overflow:hidden}
.ov4 .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 8s ease}
.on .ov4 .t img{transform:scale(1.1)}
.ov4 .t::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.ov4 .tx{position:absolute;left:0;right:0;top:120px;text-align:center;color:#fff;z-index:2;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.ov4 .big{font-family:var(--serif);font-size:120px;line-height:1}
.ov4 .latin{font-size:46px;letter-spacing:.3em;margin-top:18px;font-weight:300}
.ov4 .nm{font-size:24px;letter-spacing:.3em;margin-top:22px;opacity:.9}

/* 植物 */
.band{position:absolute;left:0;right:0;z-index:3;text-align:center;background:rgba(255,255,255,.72);padding:22px 0;backdrop-filter:blur(4px)}
.band h2{font-family:var(--serif);font-size:62px;font-weight:700;color:var(--rose);letter-spacing:.2em;margin:0}
.band .latin{font-size:24px;color:var(--ink2);margin-top:6px}
.band p{font-size:26px;color:var(--rose);margin-top:12px}
.bul{list-style:none;margin:0;padding:0}
.bul li{position:relative;padding:8px 0 8px 30px;font-size:22px;line-height:1.65;color:var(--ink)}
.bul li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--leaf)}

  <div class="help">键盘：← → 翻页 ｜ 空格 下一页 ｜ P 自动播放 ｜ F 全屏 ｜ M 目录 ｜ Home / End 首尾页 ｜ 页码与原方案 PDF 页码一一对应</div></div>

<script src="assets/layers/layers.js"></script>
<script>
(() => {
/* 图片路径：单文件版由 build.py 注入 window.IMG（内嵌图片），源码版读取 assets/img/ */
const img = n => (window.IMG && window.IMG[n]) || 'assets/img/' + n + '.jpg';
const pad = n => String(n).padStart(2, '0');
let D = 0;                       // 当前页的动画时序游标（秒）
const d = (step = .12) => (D += step).toFixed(2) + 's';
const fx = (cls, step, css = '') => `class="fx ${cls}" style="--d:${d(step)};${css}"`;
/* 分析图生长动画：若 assets/layers 中有该图的图层，则底图之上逐层"长"出色块、箭头与标签 */
let END = 0;
function pic(name, alt = '', start = .9, fit = 'meet') {
  const L = window.LAYERS && window.LAYERS[name];
  if (!L) return `<img src="${img(name)}" alt="${alt}"${fit === 'slice' ? ' style="object-fit:cover"' : ''}>`;
  const area = L.w * L.h;
  const ctx = L.layers.filter(l => l.w * l.h > .25 * area), rest = L.layers.filter(l => !ctx.includes(l));
  const step = Math.min(.45, 3.2 / Math.max(1, rest.length));
  const delay = new Map();
  let t = start;
  ctx.forEach(l => { delay.set(l, t); t += .5; });     // 先铺开大面积的底层（如地块、底图线稿）
  rest.forEach(l => { delay.set(l, t); t += step; });  // 再按原图绘制顺序逐层生长
  END = Math.max(END, t + 1.4);
  return `<svg class="ly" viewBox="0 0 ${L.w} ${L.h}" preserveAspectRatio="xMidYMid ${fit}" role="img" aria-label="${alt}">
    <image href="${L.base}" width="${L.w}" height="${L.h}"/>
    ${L.layers.map(l => `<image class="lyr ${l.kind}" href="${l.src}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" style="--d:${delay.get(l).toFixed(2)}s"/>`).join('')}</svg>`;
}
const hd = (cn, en) => `<div class="hd fx down" style="--d:.05s"><b>${cn}</b><span>${en}</span></div>`;

/* 每页：ch=篇章，t=页名，cls=版式类，dur=自动播放停留秒数，html=生成内容的函数 */
const SLIDES = [];
const add = o => SLIDES.push(o);
const page = (ch, t, cls, dur, html) => add({ ch, t, cls, dur, html });

/* ---------- 版式模板 ---------- */
function divider(n, q, en, pic) {
  page(`PART ${n}`, `PART ${n} ${q}`, 'divi', 5, () => `
    <div class="pic fx iris"><div class="bg kb" style="background-image:url(${img(pic)})"></div></div>
    <div class="arch fx right" style="--d:.2s"></div>
    <div class="part fx up" style="--d:.6s">PART<em>${n}</em></div>
    <div class="ln fx wipe" style="--d:1s"></div>
    <div class="q fx up" style="--d:1.1s">${q}</div>
    <div class="en latin fx up" style="--d:1.3s">${en}</div>`);
}
function subDivider(ch, cn, en) {
  page(ch, cn, 'cream sub', 4, () => `
    <svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
      <path class="draw" pathLength="1" style="--d:.2s;--t:2s" d="M0,610 H1600" stroke="#1d1a17" stroke-width="2"/>
    </svg>
    <div class="t"><b class="fx up" style="--d:.4s">${cn}</b><span class="fx left" style="--d:.9s">${en}</span></div>`);
}
const ZONE = {};   // 分区名 -> {district, en}
function plan(p, district, cn, en, fn, items, opt = {}) {
  ZONE[cn] = { district, en };
  page(`PART 5 · ${district}`, `${cn} · 分区平面`, 'plan', 9, () => opt.wide ? `
    ${hd(opt.title, opt.titleEn)}
    <div class="box fx wipe" style="--d:.2s;left:96px;right:96px;top:300px;height:500px"><img src="${img('plan' + p)}" alt="分区平面"></div>
    <div class="box fx up" style="--d:.4s;right:96px;top:110px;width:620px;height:160px"><img src="${img('key' + p)}" alt="索引"></div>
    <ul class="legend" style="top:850px;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 80px">${items.map((t, i) => `<li ${fx('up')}><b>${pad(i + 1)}</b>${t}</li>`).join('')}</ul>
    <div class="pn">${p}</div>`
  : `
    ${hd('分区平面', 'Zone Plan')}
    <div class="pl-box fx zoom" style="--d:.15s"><img src="${img('plan' + p)}" alt="分区平面"></div>
    <div class="pl-r">
      ${fn ? `<span class="fn fx up" style="--d:.3s">${fn}</span>` : ''}
      <h2 class="fx up" style="--d:.4s">${cn}</h2>
      <div class="en fx up" style="--d:.55s">${en}</div>
      <div class="key fx up" style="--d:.7s"><img src="${img('key' + p)}" alt="索引"></div>
      <ul>${items.map((t, i) => `<li class="fx right" style="--d:${(.8 + i * .12).toFixed(2)}s"><b>${pad(i + 1)}</b>${t}</li>`).join('')}</ul>
    </div>
    <div class="pn">${p}</div>`);
}
function render(p, cn, i, n, extra = {}) {
  const z = ZONE[cn];
  page(`PART 5 · ${z.district}`, `${cn} · 效果展示 ${i}/${n}`, 'rd', 6, () => `
    <div class="full"><img class="kb" style="--kbs:1.06;--kbd:9s" src="${img('r' + p)}" alt="${cn}效果图"></div>
    <div class="cap"></div>
    <div class="tag fx down" style="--d:.3s">${extra.tag || '效果展示'}</div>
    <div class="ct fx up" style="--d:.4s"><div class="k">${z.district}</div><div class="n">${cn}<small>${z.en}</small></div></div>
    <div class="idx fx up" style="--d:.5s">${pad(p)}<b>${pad(i)} / ${pad(n)}</b></div>
    ${extra.html || ''}`);
}
/* 拼贴：按原页面中的位置比例重新排布照片。items: [图名, x0, y0, x1, y1, 标签?] */
function collage(items, box, gap = 8, anim = 'zoom') {
  const x0 = Math.min(...items.map(i => i[1])), y0 = Math.min(...items.map(i => i[2]));
  const sx = box.w / (Math.max(...items.map(i => i[3])) - x0), sy = box.h / (Math.max(...items.map(i => i[4])) - y0);
  return items.map(it => {
    const l = box.l + (it[1] - x0) * sx, t = box.t + (it[2] - y0) * sy;
    const w = (it[3] - it[1]) * sx - gap, h = (it[4] - it[2]) * sy - gap;
    return `<div class="cl fx ${anim}" style="--d:${d(.12)};left:${l.toFixed(0)}px;top:${t.toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px">
      <img src="${img(it[0])}" alt="">${it[5] ? `<span class="lab">${it[5]}</span>` : ''}</div>`;
  }).join('');
}

/* =================== 01–02 封面 · 目录 =================== */
page('封面', '封面', 'dark cover', 9, () => `
  <div class="bg kb" style="background-image:url(${img('r37')});--kbd:22s"></div>
  <div class="shade" style="background:linear-gradient(90deg,rgba(10,8,7,.9) 0%,rgba(10,8,7,.6) 45%,rgba(10,8,7,.08) 80%)"></div>
  <div class="cover-txt">
    <div class="eyebrow fx up" style="--d:.3s">义乌垂直楼项目景观方案设计</div>
    <h1 class="chars" data-d0=".6" data-st=".14">义巷·漫游集</h1>
    <div class="latin lt fx up" style="--d:1.6s">Yixiang · Roaming Collection</div>
    <div class="rule fx wipe" style="--d:1.9s"></div>
    <div class="slogan fx blur" style="--d:2.3s">经纬之间，自在漫游</div>
  </div>
  <div class="meta fx up" style="--d:2.8s">2026.10<br>杭州市建筑设计研究院股份有限公司</div>`);

page('目录', '目录', 'dark', 8, () => `
  <div class="bg kb" style="background-image:url(${img('r81')});opacity:.16"></div>
  <div class="toc-l"><div class="big fx left" style="--d:.2s">目录</div><div class="latin fx left" style="--d:.45s">Contents</div></div>
  <ul class="toc-list">${['我们拥有怎样的场地条件？', '国际前沿商业空间是怎样？', '我们需要怎样的场所景观？', '我们如何整体化布局景观？', '我们如何分区化打造场景？', '我们如何专项化打造场景？']
    .map((q, i) => `<li class="fx right" style="--d:${(.5 + i * .15).toFixed(2)}s" data-goto="PART ${i + 1}"><span class="n">PART<em>${i + 1}</em></span><span class="q">${q}</span></li>`).join('')}</ul>`);

/* =================== PART 1 场地条件 =================== */
divider(1, '我们拥有怎样的场地条件？', 'Site Conditions', 'div1');

page('PART 1 · 场地条件', '项目区位', '', 11, () => `
  ${hd('项目区位', 'Project Location')}
  <div style="position:absolute;left:96px;top:190px;width:560px">
    <div style="display:flex;gap:60px;margin-bottom:40px">
      <div ${fx('up')}><div style="font-family:var(--latin);font-size:96px;color:var(--rose);line-height:1"><span data-count="10">0</span><small style="font-size:36px;color:var(--ink2)"> km</small></div><div style="font-size:22px;color:var(--ink2)">距义乌站（直线）</div></div>
      <div ${fx('up')}><div style="font-family:var(--latin);font-size:96px;color:var(--rose);line-height:1"><span data-count="8.5" data-dec="1">0</span><small style="font-size:36px;color:var(--ink2)"> km</small></div><div style="font-size:22px;color:var(--ink2)">距义乌机场</div></div>
    </div>
    <p class="lead fx up" style="--d:${d(.2)}">项目距离义乌站直线距离 <b>10 公里</b>，义乌机场 <b>8.5 公里</b>，均在项目西南方向；项目西北方向主要为城市的体育文化用地，北侧为办公楼，其他方向为住宅区。</p>
    <p class="lead fx up" style="--d:${d(.2)};margin-top:26px"><b class="rose">西北向</b>因承接主要城市人流，宜作为项目的<b>主入口及形象展示面</b>，强化公共性与开放性；<b class="rose">其余方向</b>以周边社区居民为主要服务对象，宜<b>弱化边界感</b>，营造亲切、宜人的社区氛围。</p>
  </div>
  <div class="box fx zoom" style="--d:.2s;left:700px;right:96px;top:150px;bottom:70px">${pic('map', '区位图', .9)}</div>
  <div class="pn">04</div>`);

page('PART 1 · 场地条件', '项目概况', '', 10, () => `
  ${hd('项目概况', 'Project Overview')}
  <div class="box fx wipe" style="--d:.2s;left:96px;right:96px;top:160px;height:640px">${pic('site', '红线范围', .9)}</div>
  <div style="position:absolute;left:96px;right:96px;top:840px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px">
    ${[['19519.18', 2, '㎡', '用地红线面积'], ['6831.2', 1, '㎡', '建筑占地面积'], ['12687.98', 2, '㎡', '景观面积'], ['20', 0, '%', '规划绿地率']].map(([v, dec, u, k]) => `
    <div ${fx('up', .15, 'border-top:3px solid var(--rose);padding-top:14px')}><div style="font-family:var(--latin);font-size:72px;line-height:1;color:var(--ink)"><span data-count="${v}" data-dec="${dec}">0</span><small style="font-size:32px;color:var(--ink2)"> ${u}</small></div><div style="font-size:24px;color:var(--ink2);margin-top:8px">${k}</div></div>`).join('')}
  </div>
  <div class="pn">05</div>`);

page('PART 1 · 场地条件', '交通分析', '', 10, () => `
  ${hd('交通分析', 'Traffic Analysis')}
  <div style="position:absolute;left:96px;top:190px;width:430px">
    <p class="lead fx up" style="--d:.3s">场地内部实现<b class="rose">人车分流</b>，从而保证环境的安静及安全。<br><br>非机动车位建议<b class="rose">移至人行道</b>。</p>
    <p class="lead-en fx up" style="--d:.5s">Pedestrian and vehicular traffic are separated within the site to ensure a quiet and safe environment. It is recommended that non-motorized vehicle parking spaces be relocated to the pedestrian walkways.</p>
  </div>
  <div class="box fx zoom" style="--d:.2s;left:580px;right:60px;top:110px;bottom:60px">${pic('traffic', '交通分析', .9)}</div>
  <div class="pn">06</div>`);

page('PART 1 · 场地条件', '竖向分析', '', 9, () => `
  ${hd('竖向分析', 'Vertical Analysis')}
  <div style="position:absolute;left:96px;top:190px;right:96px">
    <p class="lead fx up" style="--d:.3s;font-size:30px">由西向东地势呈<b class="rose">升高趋势</b>，场地内部地势<b class="rose">基本平稳</b>。</p>
    <p class="lead-en fx up" style="--d:.45s">The terrain rises from west to east, while the site itself is generally level.</p>
  </div>
  <div class="box fx wipe" style="--d:.5s;left:96px;right:96px;top:330px;bottom:60px">${pic('vertical', '竖向分析', .9)}</div>
  <div class="pn">07</div>`);

page('PART 1 · 场地条件', '建筑业态', '', 8, () => `
  ${hd('建筑业态', 'Building Type')}

/* ---------- 生成页面 ---------- */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.map((s, i) => {
  D = .1; END = 0;
  const html = s.html();
  s.dur = Math.max(s.dur || 8, END + 2.5);       // 有生长动画的页面，自动播放时多停留到动画结束
  return `<section class="slide ${s.cls}" data-i="${i}"${s.id ? ` id="${s.id}"` : ''}>${html}</section>`;
}).join('');
const slides = [...stage.children];
const N = slides.length;
document.querySelectorAll('.chars').forEach(el => {
  const d0 = parseFloat(el.dataset.d0 || 0), st = parseFloat(el.dataset.st || .08);
  el.innerHTML = [...el.textContent].map((c, i) => `<span style="--d:${(d0 + i * st).toFixed(2)}s">${c}</span>`).join('');
});
{
  let h = ''; for (let i = 0; i < 46; i++) h += `<i style="top:${(Math.random() * 100).toFixed(1)}%;--sp:${(.35 + Math.random() * .6).toFixed(2)}s;--dl:-${Math.random().toFixed(2)}s;opacity:${(.3 + Math.random() * .7).toFixed(2)}"></i>`;
  document.querySelector('[data-streaks]').innerHTML = h;
  let m = ''; for (let i = 0; i < 34; i++) m += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;--z:${(3 + Math.random() * 7).toFixed(1)}px;--sp:${(6 + Math.random() * 8).toFixed(1)}s;--mx:${(Math.random() * 120 - 60).toFixed(0)}px;--my:${(Math.random() * 120 - 60).toFixed(0)}px"></i>`;
  document.querySelector('[data-motes]').innerHTML = m;
}

/* ---------- 播放引擎 ---------- */
let cur = -1, playing = false, timers = [], autoT = null;
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
addEventListener('resize', fit); fit();
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const every = (fn, ms) => timers.push(setInterval(fn, ms));
const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

function countUp(el) {
  const to = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0);
  const host = el.closest('[style*="--d"]');
  const delay = host ? parseFloat(getComputedStyle(host).getPropertyValue('--d')) * 1000 || 0 : 0;
  const fmt = v => v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  el.textContent = fmt(0);
  later(() => {
    const t0 = performance.now(), dur = 1800;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(to * e); if (p < 1 && el.closest('.slide.on')) requestAnimationFrame(step); else el.textContent = fmt(to); };
    requestAnimationFrame(step);
  }, delay + 200);
}
function runMasterPlan() {
  const mp = document.getElementById('mp'), lis = [...document.querySelectorAll('#mpSlide .legend li')];
  let k = -1;
  const step = () => {
    mp.querySelectorAll('.hot').forEach(h => h.remove()); lis.forEach(l => l.classList.remove('cur'));
    k = (k + 1) % LEGEND.length; lis[k].classList.add('cur');
    LEGEND[k][1].forEach(([x, y]) => { const h = document.createElement('div'); h.className = 'hot'; h.style.left = x + '%'; h.style.top = y + '%'; mp.appendChild(h); requestAnimationFrame(() => requestAnimationFrame(() => h.classList.add('show'))); });
  };
  mp.querySelectorAll('.hot').forEach(h => h.remove());
  later(() => { step(); every(step, 820); }, 1800);
}
function enter(s) {
  s.querySelectorAll('[data-count]').forEach(countUp);
  if (s.id === 'mpSlide') runMasterPlan();
  const bg = s.querySelector('[data-fsbg]');
  if (bg) { bg.style.opacity = 0; later(() => bg.style.opacity = .55, 3600); }
}

const hudCh = document.getElementById('hudCh'), hudNum = document.getElementById('hudNum'), prog = document.getElementById('prog'), tick = document.getElementById('tick');
function go(n) {
  n = Math.max(0, Math.min(N - 1, n));
  if (n === cur) return;
  clearTimers();
  if (cur >= 0) slides[cur].classList.remove('on');
  cur = n;
  const s = slides[cur];
  void s.offsetWidth;
  s.classList.add('on');
  enter(s);
  hudCh.textContent = SLIDES[cur].ch + ' ｜ ' + SLIDES[cur].t;
  hudNum.textContent = pad(cur + 1) + ' / ' + pad(N);
  prog.style.width = ((cur + 1) / N * 100) + '%';
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  schedule();
  document.querySelectorAll('#menu a').forEach((a, i) => a.classList.toggle('cur', i === cur));
}
function schedule() {
  clearTimeout(autoT); tick.style.transition = 'none'; tick.style.width = '0';
  if (!playing) return;
  if (cur >= N - 1) { setPlay(false); return; }
  const dur = (SLIDES[cur].dur || 8) * 1000;
  requestAnimationFrame(() => { tick.style.transition = `width ${dur}ms linear`; tick.style.width = '100%'; });
  autoT = setTimeout(() => go(cur + 1), dur);
}
const bPlay = document.getElementById('bPlay');
function setPlay(v) { playing = v; bPlay.classList.toggle('act', v); bPlay.textContent = v ? '❚❚ 暂停' : '▶ 自动播放'; schedule(); }
const next = () => go(cur + 1), prev = () => go(cur - 1);

const menu = document.getElementById('menu');
{
  let html = '', last = null;
  SLIDES.forEach((s, i) => {
    const ch = s.ch.split(' · ')[0];
    if (ch !== last) { if (last !== null) html += '</div>'; html += `<h3>${ch}</h3><div class="g">`; last = ch; }
    html += `<a data-i="${i}"><em>${pad(i + 1)}</em>${s.t}</a>`;
  });
  document.getElementById('menuBody').innerHTML = html + '</div>';
  menu.addEventListener('click', e => { const a = e.target.closest('a'); if (a) { go(+a.dataset.i); menu.classList.remove('open'); } });
}
const toggleMenu = v => menu.classList.toggle('open', v);
document.getElementById('menuX').onclick = () => toggleMenu(false);
document.getElementById('bNext').onclick = next;
document.getElementById('bPrev').onclick = prev;
document.getElementById('bMenu').onclick = () => toggleMenu(true);
bPlay.onclick = () => setPlay(!playing);
const fullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
document.getElementById('bFull').onclick = fullscreen;
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-goto]');
  if (t) { go(SLIDES.findIndex(s => s.t.startsWith(t.dataset.goto + ' '))); return; }
  const r = stage.getBoundingClientRect();
  (e.clientX - r.left < r.width * .25) ? prev() : next();
});
addEventListener('keydown', e => {
  if (menu.classList.contains('open') && e.key !== 'Escape' && e.key.toLowerCase() !== 'm') return;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
    case 'Home': go(0); break;
    case 'End': go(N - 1); break;
    case 'p': case 'P': setPlay(!playing); break;
    case 'f': case 'F': fullscreen(); break;
    case 'm': case 'M': toggleMenu(!menu.classList.contains('open')); break;
    case 'Escape': toggleMenu(false); break;
  }
});
let tx = null;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) (dx < 0 ? next() : prev()); tx = null; });
const hud = document.getElementById('hud'); let hideT;
const wake = () => { hud.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => hud.classList.add('hide'), 2800); };
addEventListener('mousemove', wake); wake();

go((parseInt(location.hash.slice(1)) || 1) - 1);
if (/[?&]autoplay/.test(location.search)) setPlay(true);
})();
